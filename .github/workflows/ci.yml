name: CI

on:
  push:
    branches: [main]
  pull_request:
  # o deploy.yml reaproveita esta CI como portão antes de construir as imagens
  workflow_call:

# github.workflow entra no grupo: quando chamada pelo deploy.yml, esta CI não cancela (nem é cancelada por) a da própria branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Sempre roda: instalação congelada, typecheck de tudo e os testes que NÃO precisam de banco.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # testes unitários (sem Postgres): os de integração são ignorados quando as variáveis *_INTEGRATION não estão ligadas
      - run: pnpm test:unit

  # Arquivos de deploy: o compose de produção resolve, o Caddyfile é válido e os scripts não têm erro de sintaxe.
  # Usa valores falsos gerados na hora (deploy/validate.sh); não toca em servidor nenhum.
  deploy-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/validate.sh

  # Integração com Postgres de verdade (RLS, constraints). Banco descartável do próprio job; nunca toca em outro.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: duckzap
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: duckzap_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duckzap -d duckzap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # segredos só deste job descartável
      APP_DB_PASSWORD: ci-app-password
      ADMIN_DB_PASSWORD: ci-admin-password
      ADMIN_SEED_PASSWORD: ci-Seed-password-not-for-prod-9
      DATABASE_ADMIN_URL: postgres://duckzap:ci-only-password@127.0.0.1:5432/duckzap_ci
      DATABASE_URL: postgres://duckzap_app:ci-app-password@127.0.0.1:5432/duckzap_ci
      ADMIN_DATABASE_URL: postgres://duckzap_admin:ci-admin-password@127.0.0.1:5432/duckzap_ci
      LLM_PROVIDER: fake
      NODE_ENV: test
      CLIENTES_INTEGRATION: "1"
      AGENDA_INTEGRATION: "1"
      AGENDA_EXCLUSION_CONSTRAINT: "1"
      ADMIN_INTEGRATION: "1"
      CONVERSATIONS_INTEGRATION: "1"
      CAMPAIGNS_ALLOW_DEV_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gerar chaves de teste
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Preparar o banco (migrations, papéis, seed)
        run: pnpm --filter @duckzap/db db:setup
      - run: pnpm --filter @duckzap/db test
      - run: pnpm --filter @duckzap/api test
      - run: pnpm --filter @duckzap/ai test
